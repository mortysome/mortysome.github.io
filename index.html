<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b, #334155);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      position: relative;
    }

    /* Floating blurred circles */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 12s ease-in-out infinite;
    }

    .blob1 {
      width: 300px;
      height: 300px;
      background: #38bdf8;
      top: -80px;
      left: -50px;
    }

    .blob2 {
      width: 250px;
      height: 250px;
      background: #818cf8;
      bottom: -60px;
      right: -40px;
      animation-delay: 3s;
    }

    .blob3 {
      width: 180px;
      height: 180px;
      background: #67e8f9;
      top: 40%;
      left: 60%;
      animation-delay: 6s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) translateX(0px);
      }
      50% {
        transform: translateY(-20px) translateX(15px);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 600px;
      padding: 50px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 18px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.8);
    }

    .loader {
      margin: 35px auto 0;
      width: 60px;
      height: 60px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      margin-top: 28px;
      font-size: 0.9rem;
      opacity: 0.65;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      .card {
        padding: 35px 25px;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="card">
    <h1>Under Maintenance</h1>

    <p>
      The website is currently receiving a few peaceful upgrades.<br>
      We’ll be back online shortly with a better experience.
    </p>

    <div class="loader"></div>

    <div class="footer">
      Thank you for your patience ✨
    </div>
  </div>

</body>
</html>
